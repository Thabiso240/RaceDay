services:
  raceday-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: raceday-api
    ports:
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5001
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=RaceDayDb;User Id=sa;Password=RaceDayStrongPass2026!;TrustServerCertificate=True;
      - App__ApiBaseUrl=http://localhost:5001
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  raceday-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raceday-web
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ApiSettings__BaseUrl=http://raceday-api:5001
    depends_on:
      - raceday-api
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: raceday-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=RaceDayStrongPass2026!
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'RaceDayStrongPass2026!' -Q 'SELECT 1' -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
