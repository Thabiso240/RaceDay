<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" style="background-color: #0b132b; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#3a506b"/>
    </linearGradient>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00bbf9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="crow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#48cae4" stroke-width="2"/>
    </marker>
    <marker id="circle" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
      <circle cx="5" cy="5" r="3" fill="#0b132b" stroke="#48cae4" stroke-width="2"/>
    </marker>
  </defs>

  <!-- Title & Banner -->
  <rect x="0" y="0" width="1600" height="90" fill="#1c2541"/>
  <text x="50" y="55" fill="#00f5d4" font-size="28" font-weight="bold" letter-spacing="1.5">RACEDAY PLATFORM - ENTITY RELATIONSHIP DIAGRAM (ERD)</text>
  <text x="50" y="80" fill="#90e0ef" font-size="14">PROG6212 Portfolio of Evidence | Relational Schema Specification (SQL Server)</text>
  <text x="1350" y="55" fill="#ffd166" font-size="16" font-weight="600">6 Core Entities</text>
  <text x="1350" y="78" fill="#caf0f8" font-size="12">Role-Based System</text>

  <!-- TABLE 1: Users (x=60, y=140, w=320, h=330) -->
  <g filter="url(#shadow)">
    <rect x="60" y="140" width="330" height="340" rx="8" fill="#1c2541" stroke="#48cae4" stroke-width="2"/>
    <rect x="60" y="140" width="330" height="42" rx="8" fill="url(#headerGrad)"/>
    <rect x="60" y="174" width="330" height="8" fill="#3a506b"/>
    <text x="80" y="168" fill="#00f5d4" font-size="18" font-weight="bold">USERS</text>
    <text x="320" y="168" fill="#ffd166" font-size="12">Entity 1</text>

    <!-- Attributes -->
    <text x="80" y="210" fill="#ffd166" font-size="13" font-weight="bold">PK  UserId</text>
    <text x="250" y="210" fill="#caf0f8" font-size="13">INT (Identity)</text>
    
    <text x="80" y="240" fill="#ffffff" font-size="13">     FullName</text>
    <text x="250" y="240" fill="#caf0f8" font-size="13">NVARCHAR(100)</text>

    <text x="80" y="270" fill="#ffffff" font-size="13">     Email (UQ)</text>
    <text x="250" y="270" fill="#caf0f8" font-size="13">NVARCHAR(150)</text>

    <text x="80" y="300" fill="#ffffff" font-size="13">     PasswordHash</text>
    <text x="250" y="300" fill="#caf0f8" font-size="13">NVARCHAR(255)</text>

    <text x="80" y="330" fill="#ffffff" font-size="13">     Role</text>
    <text x="250" y="330" fill="#00f5d4" font-size="13">NVARCHAR(20)</text>

    <text x="80" y="360" fill="#ffffff" font-size="13">     PhoneNumber</text>
    <text x="250" y="360" fill="#caf0f8" font-size="13">NVARCHAR(20) [N]</text>

    <text x="80" y="390" fill="#ffffff" font-size="13">     ProfilePictureUrl</text>
    <text x="250" y="390" fill="#caf0f8" font-size="13">NVARCHAR(500) [N]</text>

    <text x="80" y="420" fill="#ffffff" font-size="13">     CreatedAt</text>
    <text x="250" y="420" fill="#caf0f8" font-size="13">DATETIME2</text>
  </g>

  <!-- TABLE 2: UserSessions (x=60, y=560, w=330, h=250) -->
  <g filter="url(#shadow)">
    <rect x="60" y="560" width="330" height="260" rx="8" fill="#1c2541" stroke="#48cae4" stroke-width="2"/>
    <rect x="60" y="560" width="330" height="42" rx="8" fill="url(#headerGrad)"/>
    <rect x="60" y="594" width="330" height="8" fill="#3a506b"/>
    <text x="80" y="588" fill="#00f5d4" font-size="18" font-weight="bold">USER_SESSIONS</text>
    <text x="320" y="588" fill="#ffd166" font-size="12">Entity 2</text>

    <!-- Attributes -->
    <text x="80" y="630" fill="#ffd166" font-size="13" font-weight="bold">PK  SessionId</text>
    <text x="250" y="630" fill="#caf0f8" font-size="13">INT (Identity)</text>
    
    <text x="80" y="660" fill="#06d6a0" font-size="13" font-weight="bold">FK  UserId</text>
    <text x="250" y="660" fill="#caf0f8" font-size="13">INT</text>

    <text x="80" y="690" fill="#ffffff" font-size="13">     SessionToken (UQ)</text>
    <text x="250" y="690" fill="#caf0f8" font-size="13">NVARCHAR(100)</text>

    <text x="80" y="720" fill="#ffffff" font-size="13">     Role</text>
    <text x="250" y="720" fill="#caf0f8" font-size="13">NVARCHAR(20)</text>

    <text x="80" y="750" fill="#ffffff" font-size="13">     CreatedAt</text>
    <text x="250" y="750" fill="#caf0f8" font-size="13">DATETIME2</text>

    <text x="80" y="780" fill="#ffffff" font-size="13">     ExpiresAt</text>
    <text x="250" y="780" fill="#caf0f8" font-size="13">DATETIME2</text>
  </g>

  <!-- TABLE 3: Events (x=480, y=140, w=340, h=400) -->
  <g filter="url(#shadow)">
    <rect x="480" y="140" width="340" height="420" rx="8" fill="#1c2541" stroke="#48cae4" stroke-width="2"/>
    <rect x="480" y="140" width="340" height="42" rx="8" fill="url(#headerGrad)"/>
    <rect x="480" y="174" width="340" height="8" fill="#3a506b"/>
    <text x="500" y="168" fill="#00f5d4" font-size="18" font-weight="bold">EVENTS</text>
    <text x="750" y="168" fill="#ffd166" font-size="12">Entity 3</text>

    <!-- Attributes -->
    <text x="500" y="210" fill="#ffd166" font-size="13" font-weight="bold">PK  EventId</text>
    <text x="680" y="210" fill="#caf0f8" font-size="13">INT (Identity)</text>
    
    <text x="500" y="240" fill="#06d6a0" font-size="13" font-weight="bold">FK  OrganiserId</text>
    <text x="680" y="240" fill="#caf0f8" font-size="13">INT (Users)</text>

    <text x="500" y="270" fill="#ffffff" font-size="13">     Title</text>
    <text x="680" y="270" fill="#caf0f8" font-size="13">NVARCHAR(150)</text>

    <text x="500" y="300" fill="#ffffff" font-size="13">     Description</text>
    <text x="680" y="300" fill="#caf0f8" font-size="13">NVARCHAR(MAX)</text>

    <text x="500" y="330" fill="#ffffff" font-size="13">     EventDate</text>
    <text x="680" y="330" fill="#caf0f8" font-size="13">DATETIME2</text>

    <text x="500" y="360" fill="#ffffff" font-size="13">     Location</text>
    <text x="680" y="360" fill="#caf0f8" font-size="13">NVARCHAR(200)</text>

    <text x="500" y="390" fill="#ffffff" font-size="13">     DistanceKm</text>
    <text x="680" y="390" fill="#caf0f8" font-size="13">DECIMAL(5,2)</text>

    <text x="500" y="420" fill="#ffffff" font-size="13">     EventType</text>
    <text x="680" y="420" fill="#00f5d4" font-size="13">Run | Walk | Cycle</text>

    <text x="500" y="450" fill="#ffffff" font-size="13">     BannerImageUrl</text>
    <text x="680" y="450" fill="#caf0f8" font-size="13">NVARCHAR(500) [N]</text>

    <text x="500" y="480" fill="#ffffff" font-size="13">     Status</text>
    <text x="680" y="480" fill="#caf0f8" font-size="13">NVARCHAR(20)</text>

    <text x="500" y="510" fill="#ffffff" font-size="13">     CreatedAt</text>
    <text x="680" y="510" fill="#caf0f8" font-size="13">DATETIME2</text>
  </g>

  <!-- TABLE 4: Categories (x=480, y=620, w=340, h=300) -->
  <g filter="url(#shadow)">
    <rect x="480" y="620" width="340" height="300" rx="8" fill="#1c2541" stroke="#48cae4" stroke-width="2"/>
    <rect x="480" y="620" width="340" height="42" rx="8" fill="url(#headerGrad)"/>
    <rect x="480" y="654" width="340" height="8" fill="#3a506b"/>
    <text x="500" y="648" fill="#00f5d4" font-size="18" font-weight="bold">CATEGORIES</text>
    <text x="750" y="648" fill="#ffd166" font-size="12">Entity 4</text>

    <!-- Attributes -->
    <text x="500" y="690" fill="#ffd166" font-size="13" font-weight="bold">PK  CategoryId</text>
    <text x="680" y="690" fill="#caf0f8" font-size="13">INT (Identity)</text>
    
    <text x="500" y="720" fill="#06d6a0" font-size="13" font-weight="bold">FK  EventId</text>
    <text x="680" y="720" fill="#caf0f8" font-size="13">INT (Events)</text>

    <text x="500" y="750" fill="#ffffff" font-size="13">     Name</text>
    <text x="680" y="750" fill="#caf0f8" font-size="13">NVARCHAR(100)</text>

    <text x="500" y="780" fill="#ffffff" font-size="13">     Description</text>
    <text x="680" y="780" fill="#caf0f8" font-size="13">NVARCHAR(500) [N]</text>

    <text x="500" y="810" fill="#ffffff" font-size="13">     MinAge / MaxAge</text>
    <text x="680" y="810" fill="#caf0f8" font-size="13">INT / INT [N]</text>

    <text x="500" y="840" fill="#ffffff" font-size="13">     DistanceKm</text>
    <text x="680" y="840" fill="#caf0f8" font-size="13">DECIMAL(5,2) [N]</text>

    <text x="500" y="870" fill="#ffffff" font-size="13">     EntryFee</text>
    <text x="680" y="870" fill="#caf0f8" font-size="13">DECIMAL(10,2)</text>
  </g>

  <!-- TABLE 5: Enrolments (x=900, y=140, w=330, h=350) -->
  <g filter="url(#shadow)">
    <rect x="900" y="140" width="330" height="350" rx="8" fill="#1c2541" stroke="#48cae4" stroke-width="2"/>
    <rect x="900" y="140" width="330" height="42" rx="8" fill="url(#headerGrad)"/>
    <rect x="900" y="174" width="330" height="8" fill="#3a506b"/>
    <text x="920" y="168" fill="#00f5d4" font-size="18" font-weight="bold">ENROLMENTS</text>
    <text x="1160" y="168" fill="#ffd166" font-size="12">Entity 5</text>

    <!-- Attributes -->
    <text x="920" y="210" fill="#ffd166" font-size="13" font-weight="bold">PK  EnrolmentId</text>
    <text x="1090" y="210" fill="#caf0f8" font-size="13">INT (Identity)</text>
    
    <text x="920" y="240" fill="#06d6a0" font-size="13" font-weight="bold">FK  ParticipantId</text>
    <text x="1090" y="240" fill="#caf0f8" font-size="13">INT (Users)</text>

    <text x="920" y="270" fill="#06d6a0" font-size="13" font-weight="bold">FK  EventId</text>
    <text x="1090" y="270" fill="#caf0f8" font-size="13">INT (Events)</text>

    <text x="920" y="300" fill="#06d6a0" font-size="13" font-weight="bold">FK  CategoryId</text>
    <text x="1090" y="300" fill="#caf0f8" font-size="13">INT (Categories)</text>

    <text x="920" y="330" fill="#ffffff" font-size="13">     EnrolmentDate</text>
    <text x="1090" y="330" fill="#caf0f8" font-size="13">DATETIME2</text>

    <text x="920" y="360" fill="#ffffff" font-size="13">     Status</text>
    <text x="1090" y="360" fill="#00f5d4" font-size="13">Confirmed | Pending</text>

    <text x="920" y="390" fill="#ffffff" font-size="13">     BibNumber</text>
    <text x="1090" y="390" fill="#caf0f8" font-size="13">INT</text>
  </g>

  <!-- TABLE 6: Results (x=1280, y=140, w=300, h=390) -->
  <g filter="url(#shadow)">
    <rect x="1280" y="140" width="300" height="390" rx="8" fill="#1c2541" stroke="#48cae4" stroke-width="2"/>
    <rect x="1280" y="140" width="300" height="42" rx="8" fill="url(#headerGrad)"/>
    <rect x="1280" y="174" width="300" height="8" fill="#3a506b"/>
    <text x="1300" y="168" fill="#00f5d4" font-size="18" font-weight="bold">RESULTS</text>
    <text x="1510" y="168" fill="#ffd166" font-size="12">Entity 6</text>

    <!-- Attributes -->
    <text x="1300" y="210" fill="#ffd166" font-size="13" font-weight="bold">PK  ResultId</text>
    <text x="1460" y="210" fill="#caf0f8" font-size="13">INT (Identity)</text>
    
    <text x="1300" y="240" fill="#06d6a0" font-size="13" font-weight="bold">FK  EnrolmentId</text>
    <text x="1460" y="240" fill="#caf0f8" font-size="13">INT (1:1)</text>

    <text x="1300" y="270" fill="#06d6a0" font-size="13" font-weight="bold">FK  ParticipantId</text>
    <text x="1460" y="270" fill="#caf0f8" font-size="13">INT (Users)</text>

    <text x="1300" y="300" fill="#06d6a0" font-size="13" font-weight="bold">FK  EventId</text>
    <text x="1460" y="300" fill="#caf0f8" font-size="13">INT (Events)</text>

    <text x="1300" y="330" fill="#ffffff" font-size="13">     FinishTime</text>
    <text x="1460" y="330" fill="#caf0f8" font-size="13">NVARCHAR(20)</text>

    <text x="1300" y="360" fill="#ffffff" font-size="13">     FinishSeconds</text>
    <text x="1460" y="360" fill="#caf0f8" font-size="13">INT</text>

    <text x="1300" y="390" fill="#ffffff" font-size="13">     FinishingPosition</text>
    <text x="1460" y="390" fill="#ffd166" font-size="13">INT (e.g. 47)</text>

    <text x="1300" y="420" fill="#ffffff" font-size="13">     TotalFinishers</text>
    <text x="1460" y="420" fill="#ffd166" font-size="13">INT (e.g. 312)</text>

    <text x="1300" y="450" fill="#ffffff" font-size="13">     PublishedAt</text>
    <text x="1460" y="450" fill="#caf0f8" font-size="13">DATETIME2</text>
  </g>

  <!-- RELATIONSHIP LINES -->
  <!-- 1. Users -> Events (1 to Many: Organiser creates events) -->
  <path d="M 390 250 L 480 250" fill="none" stroke="#48cae4" stroke-width="2.5" marker-end="url(#crow)"/>
  <text x="400" y="240" fill="#00f5d4" font-size="11" font-weight="bold">1:M (Organises)</text>

  <!-- 2. Users -> UserSessions (1 to Many) -->
  <path d="M 220 480 L 220 560" fill="none" stroke="#48cae4" stroke-width="2.5" marker-end="url(#crow)"/>
  <text x="225" y="525" fill="#00f5d4" font-size="11" font-weight="bold">1:M (Sessions)</text>

  <!-- 3. Events -> Categories (1 to Many) -->
  <path d="M 650 560 L 650 620" fill="none" stroke="#48cae4" stroke-width="2.5" marker-end="url(#crow)"/>
  <text x="655" y="595" fill="#00f5d4" font-size="11" font-weight="bold">1:M (Has Categories)</text>

  <!-- 4. Events -> Enrolments (1 to Many) -->
  <path d="M 820 280 L 900 280" fill="none" stroke="#48cae4" stroke-width="2.5" marker-end="url(#crow)"/>
  <text x="830" y="270" fill="#00f5d4" font-size="11" font-weight="bold">1:M (Registrations)</text>

  <!-- 5. Categories -> Enrolments (1 to Many) -->
  <path d="M 820 720 L 980 720 L 980 490" fill="none" stroke="#48cae4" stroke-width="2.5" marker-end="url(#crow)"/>
  <text x="840" y="710" fill="#00f5d4" font-size="11" font-weight="bold">1:M (Category Enrolments)</text>

  <!-- 6. Enrolments -> Results (1 to 1) -->
  <path d="M 1230 250 L 1280 250" fill="none" stroke="#ffd166" stroke-width="2.5"/>
  <circle cx="1255" cy="250" r="4" fill="#ffd166"/>
  <text x="1235" y="240" fill="#ffd166" font-size="11" font-weight="bold">1:1 (Result)</text>

  <!-- 7. Users -> Enrolments (1 to Many: Participant enters events) -->
  <path d="M 250 480 L 250 520 L 930 520 L 930 490" fill="none" stroke="#06d6a0" stroke-width="2" stroke-dasharray="4" marker-end="url(#crow)"/>
  <text x="320" y="515" fill="#06d6a0" font-size="11" font-weight="bold">1:M (Participant Enrolment)</text>

  <!-- Legend & Footer -->
  <rect x="900" y="580" width="670" height="340" rx="8" fill="#162238" stroke="#3a506b" stroke-width="1.5"/>
  <text x="920" y="615" fill="#00f5d4" font-size="16" font-weight="bold">ERD SCHEMA DESIGN NOTES &amp; CARDINALITY SPECIFICATION</text>
  
  <text x="920" y="650" fill="#ffd166" font-size="13" font-weight="bold">Primary Keys (PK):</text>
  <text x="1070" y="650" fill="#e0e1dd" font-size="13">Surrogate auto-incrementing integer identity columns.</text>

  <text x="920" y="680" fill="#06d6a0" font-size="13" font-weight="bold">Foreign Keys (FK):</text>
  <text x="1070" y="680" fill="#e0e1dd" font-size="13">Enforce referential integrity (ON DELETE NO ACTION / CASCADE).</text>

  <text x="920" y="710" fill="#00bbf9" font-size="13" font-weight="bold">Roles Enforced:</text>
  <text x="1070" y="710" fill="#e0e1dd" font-size="13">Organiser (creates events/categories, records results) vs Participant (registers, enters).</text>

  <text x="920" y="740" fill="#ffffff" font-size="13" font-weight="bold">Key Relationships:</text>
  <text x="930" y="765" fill="#caf0f8" font-size="12">• Users (1) ── (M) Events [Organiser creates multiple events]</text>
  <text x="930" y="785" fill="#caf0f8" font-size="12">• Events (1) ── (M) Categories [Event has Under 20, Senior, 10km, 21km]</text>
  <text x="930" y="805" fill="#caf0f8" font-size="12">• Events (1) ── (M) Enrolments [Multiple participants enter an event]</text>
  <text x="930" y="825" fill="#caf0f8" font-size="12">• Categories (1) ── (M) Enrolments [Enrolment belongs to a specific category]</text>
  <text x="930" y="845" fill="#caf0f8" font-size="12">• Enrolments (1) ── (1) Results [Each enrolment produces at most 1 race result]</text>
  <text x="930" y="865" fill="#caf0f8" font-size="12">• Users (1) ── (M) UserSessions [Role-based session persistence across requests]</text>

  <text x="920" y="900" fill="#ffd166" font-size="12" font-style="italic">Generated for PROG6212 POE - Exactly aligns with SQL Server DDL and EF Core Code-First.</text>
</svg>